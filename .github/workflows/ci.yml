name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: ecoguard_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://appuser:testpassword@localhost:5432/ecoguard_test_db
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: placeholder
          WAQI_KEY: placeholder
        run: |
          pytest tests/ -v